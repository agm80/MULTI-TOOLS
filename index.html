<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bengkel — Multitool untuk Kerjaan Kecil</title>
<meta name="description" content="Kumpulan tools kecil yang sering kepake: converter, generator, text tools, image tools, dan dev tools. Semua jalan di browser, tanpa server.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">

  <aside class="pegboard" id="pegboard">
    <div class="pegboard__head">
      <div class="pegboard__mark">🔧</div>
      <div>
        <div class="pegboard__title">Bengkel</div>
        <div class="pegboard__sub">21 tools, nol backend</div>
      </div>
    </div>

    <input type="text" id="toolSearch" class="pegboard__search" placeholder="Cari tool...">

    <nav id="pegboard__nav" class="pegboard__nav"></nav>

    <div class="pegboard__foot">Semua proses di browser kamu.<br>Gak ada yang dikirim ke server.</div>
  </aside>

  <button id="navToggle" class="nav-toggle" aria-label="Buka menu">☰</button>

  <main class="workbench" id="workbench">
    <div class="workbench__empty" id="emptyState">
      <div class="workbench__empty-mark">🧰</div>
      <h1>Pilih tool di samping</h1>
      <p>Semua tool jalan langsung di browser kamu — gak ada data yang dikirim ke server manapun.</p>
    </div>
    <div class="workbench__tool" id="toolMount" hidden></div>
  </main>

</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
