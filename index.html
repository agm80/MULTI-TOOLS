<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bengkel — Multitool untuk Kerjaan Kecil</title>
<meta name="description" content="48 tools kecil yang sering kepake: kalkulator harian, converter, text tools, image tools, dan dev tools. Semua jalan di browser, tanpa server.">
<meta name="theme-color" content="#0B0B0D">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%236E62E5'/%3E%3Cpath d='M30 50h40M50 30v40' stroke='white' stroke-width='9' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsbarcode/3.11.5/JsBarcode.all.min.js"></script>
</head>
<body>

<div class="app">

  <div class="backdrop" id="backdrop"></div>

  <aside class="sidebar" id="sidebar">
    <div class="sidebar__top">
      <a href="#" class="brand" id="brandLink">
        <span class="brand__mark"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 12h12M12 6v12"/></svg></span>
        <span class="brand__name">Bengkel</span>
      </a>
      <button id="themeToggle" class="icon-btn" aria-label="Ganti tema" title="Ganti tema"></button>
      <button id="navClose" class="icon-btn sidebar__close" aria-label="Tutup menu">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>

    <div class="search-box">
      <svg class="search-box__icon" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input type="text" id="toolSearch" placeholder="Cari tool...">
    </div>

    <nav id="nav" class="nav"></nav>
  </aside>

  <button id="navToggle" class="nav-toggle" aria-label="Buka menu">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
  </button>

  <main class="main" id="main">
    <div class="empty" id="emptyState">
      <p class="empty__eyebrow">Bengkel</p>
      <h1>48 tools, satu tempat</h1>
      <p>Pilih tool di sidebar, atau ketik di kolom pencarian. Semua jalan di browser kamu — gak ada yang dikirim ke server manapun.</p>
    </div>
    <div class="tool-view" id="toolView" hidden>
      <div class="tool-toolbar" id="toolToolbar"></div>
      <div id="toolMount"></div>
    </div>
  </main>

</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
