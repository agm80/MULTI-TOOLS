<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bengkel — Multitool untuk Kerjaan Kecil</title>
<meta name="description" content="48 tools kecil yang sering kepake: kalkulator harian, converter, text tools, image tools, dan dev tools. Semua jalan di browser, tanpa server.">
<meta name="theme-color" content="#1B1B1E">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='8' fill='%234A72D6'/%3E%3Cpath d='M62 26 47 41a17 17 0 0 0-22 22L10 78l12 12 15-15a17 17 0 0 0 22-22l15-15z' fill='none' stroke='white' stroke-width='7' stroke-linecap='square'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsbarcode/3.11.5/JsBarcode.all.min.js"></script>
</head>
<body>

<div class="app">

  <header class="topbar">
    <a href="#" class="topbar__brand" id="brandLink">
      <span class="topbar__mark">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><path d="M14.7 6.3a4 4 0 0 1-5.4 5.4L4 17l3 3 5.3-5.3a4 4 0 0 1 5.4-5.4L21 6l-3-3-3.3 3.3Z"/></svg>
      </span>
      <span class="topbar__title">BENGKEL</span>
    </a>

    <div class="topbar__search">
      <span class="topbar__search-icon">⌕</span>
      <input type="text" id="toolSearch" placeholder="Cari di antara 48 tools...">
    </div>

    <button id="themeToggle" class="icon-btn" aria-label="Ganti tema" title="Ganti tema">🌙</button>
  </header>

  <div class="tabs" id="tabs"></div>

  <main class="main" id="main">
    <div class="home" id="homeView">
      <section class="section" id="favSection" hidden>
        <h2 class="section__title">Favorit</h2>
        <div class="grid" id="favGrid"></div>
      </section>
      <section class="section" id="recentSection" hidden>
        <h2 class="section__title">Baru dipakai</h2>
        <div class="grid" id="recentGrid"></div>
      </section>
      <section class="section">
        <h2 class="section__title" id="mainGridTitle">Semua tools</h2>
        <div class="grid" id="mainGrid"></div>
      </section>
      <p class="empty-msg" id="noResults" hidden>Gak ketemu tool yang cocok. Coba kata kunci lain.</p>
    </div>

    <div class="tool-view" id="toolView" hidden>
      <div class="tool-toolbar">
        <button class="back-btn" id="backBtn">← Semua tools</button>
        <span class="tool-card__tag" id="toolCode" style="margin:0"></span>
        <button class="star-btn" id="favToggleBtn">☆ Favoritkan</button>
      </div>
      <div id="toolMount"></div>
    </div>
  </main>

  <footer class="footer">Semua tool jalan di browser kamu — gak ada data yang dikirim ke server manapun.</footer>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
